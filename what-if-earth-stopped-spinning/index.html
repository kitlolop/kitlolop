/* ==== constants ==== */
const W=1920,H=1080, CY='#8fd8e6', GOLD='#ffd98a', WHITE='#ffffff';
const SUN={x:0,y:540}, RS=300, RE=175, ORB=1180;
const cv=document.getElementById('c'), g=cv.getContext('2d');

/* ==== math ==== */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const easeIO=u=>{u=clamp(u);return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2};
const easeOutQuint=u=>1-Math.pow(1-clamp(u),5);
const easeInCubic=u=>{u=clamp(u);return u*u*u};
const easeOutCubic=u=>1-Math.pow(1-clamp(u),3);
const sstep=(a,b,x)=>{const u=clamp((x-a)/(b-a));return u*u*(3-2*u)};
const win=(t,a,b,fi=.25,fo=.25)=>sstep(a,a+fi,t)*(1-sstep(b-fo,b,t));
// damped spring (damping .42-.5, freq 12-16 rad/s)
function springStep(dt,z=.45,w=14){if(dt<=0)return 0;const k=Math.sqrt(1-z*z),wd=w*k;return 1-Math.exp(-z*w*dt)*(Math.cos(wd*dt)+z/k*Math.sin(wd*dt));}
function springImp(dt,z=.45,w=14){if(dt<=0)return 0;const wd=w*Math.sqrt(1-z*z);return Math.exp(-z*w*dt)*Math.sin(wd*dt);}
function rng(seed){let s=(seed>>>0)||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
const fmt=n=>Math.round(n).toLocaleString('en-US');

/* ==== word-locked timeline ==== */
function at(line,word,n=0){const ws=WORDS.words.filter(w=>w.line===line&&w.w.toLowerCase()===word.toLowerCase());if(!ws[n])throw new Error('missing word '+line+':'+word);return ws[n].s;}
const T={
 stopped:at(0,'stopped'), planet:at(1,'The'), wouldnt:at(1,"wouldn't"),
 right:at(2,'Right'), equator:at(2,'equator'), sixteen:at(2,'sixteen'),
 stand:at(3,'Stand'), you:at(3,'you'), play:at(4,'play'), nothing:at(4,'nothing'),
 earth5:at(5,'Earth'), day5:at(5,'day'), year5:at(5,'year'),
 now:at(6,'Now'), brakes:at(6,'brakes'), air:at(7,'air'),
 winds:at(8,'Winds'), tornado:at(8,'tornado'),
 oceans:at(9,'oceans'), slosh:at(9,'slosh'), waves:at(9,'waves'), poles:at(9,'poles'),
 oneday:at(10,'day'), year10:at(10,'year'),
 six:at(11,'Six'), daylight:at(11,'daylight'), night:at(11,'night'),
 bring:at(12,'Bring'), sunglasses:at(12,'sunglasses'), mask:at(12,'mask'),
 relax:at(13,'Relax'), slowing:at(13,'slowing'), ms:at(13,'milliseconds'),
 by:at(14,'By'), km:at(14,'kilometers'), moving:at(14,'moving'),
};
T.vo=WORDS.duration; T.title=T.vo+0.36; T.end=60;
const EQ_KMS=0.4651; // equatorial surface speed, km per second

/* ==== story clock (separate from ambient clock; rewinds are coherent) ====
   branch 0: opening "what if" stop  -> rewind 1 ("Right now") ->
   branch 1: explanation + hypothetical braking -> rewind 2 ("Relax") ->
   branch 2: reality */
const RW=0.8, R1=T.right, R2=T.relax, A_BACK=T.stopped-0.55, B_BACK=T.brakes-0.45;
function story(t){
  if(t<R1) return {b:0,s:t,rw:0};
  if(t<R1+RW) return {b:0,s:lerp(R1,A_BACK,easeIO((t-R1)/RW)),rw:1};
  if(t<R2) return {b:1,s:t,rw:0};
  if(t<R2+RW) return {b:1,s:lerp(R2,B_BACK,easeIO((t-R2)/RW)),rw:2};
  return {b:2,s:t,rw:0};
}
const W0=0.22, TAU=0.14, B1=R1+RW, B2=R2+RW;
const decel=x=>x<=0?0:W0*TAU*(1-Math.exp(-x/TAU));
const spinA=s=>s<T.stopped?W0*s:W0*T.stopped+decel(s-T.stopped);
const spinB=s=>{const a=spinA(A_BACK);return s<T.brakes?a+W0*(s-B1):a+W0*(T.brakes-B1)+decel(s-T.brakes);};
const spinC=s=>spinB(B_BACK)+W0*(s-B2);
const spin=st=>st.b===0?spinA(st.s):st.b===1?spinB(st.s):spinC(st.s);
const inertial=st=>st.b===0?W0*st.s:st.b===1?W0*A_BACK+W0*(st.s-B1):W0*A_BACK+W0*(B_BACK-B1)+W0*(st.s-B2);
const stopDT=st=>st.b===0?st.s-T.stopped:st.b===1?st.s-T.brakes:-1;
const orbitA=st=>st.b===1?Math.PI*easeIO((st.s-T.six)/(T.night+0.45-T.six)):0;
const drainU=st=>st.b===1?easeIO((st.s-T.poles)/1.8):0;
const SPIN_STOPPED=spinB(T.brakes+10);

/* ==== camera: easeInOutCubic moves, zoom interpolated in log space ==== */
const CAM=[ // [start, duration, x, y, zoom]
 [0,0,1180,540,2.25],
 [0,T.planet,1180,540,2.38],
 [T.planet,1.55,960,540,1.0],
 [T.planet+1.55,T.right-T.planet-1.55,1000,540,1.06],
 [T.right,RW,1080,540,1.22],
 [T.right+RW,T.stand-T.right-RW,1140,540,1.42],
 [T.stand,1.3,1195,515,2.3],
 [T.stand+1.3,T.earth5-T.stand-1.3,1195,520,2.4],
 [T.earth5,2.9,0,540,0.3],
 [T.earth5+2.9,T.now-T.earth5-2.9,0,540,0.32],
 [T.now,1.5,1130,540,1.15],
 [T.now+1.5,T.oceans-T.now-1.5,1100,545,1.3],
 [T.oceans,2.2,1180,520,1.75],
 [T.oceans+2.2,T.oneday-0.2-T.oceans-2.2,1180,500,1.86],
 [T.oneday-0.2,2.6,0,560,0.355],
 [T.oneday+2.4,T.relax-T.oneday-2.4,0,560,0.375],
 [T.relax,RW,1150,540,1.2],
 [T.relax+RW,T.by-T.relax-RW,1160,540,1.45],
 [T.by,1.0,1185,525,1.95],
 [T.by+1.0,T.title-T.by-1.0,1185,525,2.05],
 [T.title,3.6,1080,600,0.95],
];
function camera(t){
  let c={x:CAM[0][2],y:CAM[0][3],z:CAM[0][4]};
  for(const [s,d,x,y,z] of CAM){ if(t<s) break; const u=d<=0?1:easeIO((t-s)/d);
    c={x:lerp(c.x,x,u),y:lerp(c.y,y,u),z:Math.exp(lerp(Math.log(c.z),Math.log(z),u))}; }
  // ambient drift (never static) + impact shake
  c.x+=Math.sin(t*.37)*5/c.z; c.y+=Math.cos(t*.29)*4/c.z;
  const sh=springImp(t-T.stopped,.42,16)*9+springImp(t-T.brakes,.42,16)*9;
  c.sx=sh; return c;
}
const toS=(c,x,y)=>({x:(x-c.x)*c.z+W/2+c.sx, y:(y-c.y)*c.z+H/2});

/* ==== fonts / text ==== */
function font(size,weight=700,spacing=4){g.font=`${weight} ${size}px Fredoka`; g.letterSpacing=spacing+'px';}
function tw(text,size,weight=700,spacing=4){font(size,weight,spacing);return g.measureText(text).width-spacing;}
function capsule(ctx,x,y,w,h,r){r=Math.min(r,h/2,w/2);ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
// text line that slides up 1.3x its height through a clip (ease-out-quint); exits upward
function slideText(t,text,cx,base,size,color,weight,spacing,tIn,tOut,align='center'){
  const h=size*1.12, ui=easeOutQuint((t-tIn)/.55), uo=tOut==null?0:easeInCubic((t-tOut)/.32);
  if(ui<=0||uo>=1) return 0;
  const w=tw(text,size,weight,spacing);
  const x=align==='center'?cx-w/2:cx;
  g.save(); g.beginPath(); g.rect(x-size,base-size*0.92,w+2*size,h+size*0.18); g.clip();
  g.fillStyle=color; g.textAlign='left'; g.textBaseline='alphabetic'; font(size,weight,spacing);
  g.fillText(text,x,base+(1-ui)*1.3*h-uo*1.3*h);
  g.restore(); return w;
}
// caption: capsule box rgb(6,20,40) @62% with stacked lines (each line {text|fn,color,size,t0})
function caption(t,t0,t1,lines,cx=960,cy=950){
  if(t<t0-0.05||t>t1+0.4) return;
  const pad=30, gap=12;
  const L=lines.map(l=>{const text=typeof l.text==='function'?l.text(t):l.text;const size=l.size||44;return {...l,text,size,w:tw(text,size,l.weight||700,l.sp||4)};});
  const hTot=L.reduce((a,l)=>a+l.size*1.12,0)+gap*(L.length-1)+pad*1.1;
  const wMax=Math.max(...L.map(l=>l.w))+pad*2.4;
  const ib=springStep(t-t0,.5,15), ob=sstep(t1+.05,t1+.38,t);
  const a=clamp((t-t0)/.12)*(1-ob); if(a<=0) return;
  const bw=wMax*(0.55+0.45*ib), bh=hTot*(0.7+0.3*ib);
  g.save(); g.globalAlpha=a; g.fillStyle='rgba(6,20,40,.62)'; capsule(g,cx-bw/2,cy-bh/2,bw,bh,bh/2); g.fill(); g.restore();
  let y=cy-hTot/2+pad*0.55;
  for(const l of L){ y+=l.size*0.92; slideText(t,l.text,cx,y,l.size,l.color||WHITE,l.weight||700,l.sp||4,(l.t0??t0)+0.04,t1); y+=l.size*0.2+gap; }
}
// counter card that slams in from 1.7x to 1x on a damped spring
function counter(t,t0,t1,x,y,label,valueFn,opts={}){
  if(t<t0||t>t1+0.4) return;
  const sc=1+0.7*(1-springStep(t-t0,.45,14)), ob=sstep(t1,t1+.35,t);
  const lab=label, val=valueFn(t), col=opts.color?opts.color(t):WHITE;
  const lw=tw(lab,24,600,5), vw=tw(val,78,700,3), bw=Math.max(lw,vw)+80, bh=150;
  g.save(); g.translate(x,y); g.scale(sc*(1-ob*.3),sc*(1-ob*.3)); g.translate(-x,-y);
  g.globalAlpha=clamp((t-t0)/.08)*(1-ob);
  g.fillStyle='rgba(6,20,40,.62)'; capsule(g,x-bw/2,y-bh/2,bw,bh,bh/2); g.fill();

  const md=gagDrop(st,T.mask); if(md!==null){ g.save(); g.translate(0,md); rr(-46,-178,92,26,13,'rgb(220,95,110)'); rr(-34,-171,26,10,5,'rgba(255,255,255,.25)'); rr(8,-171,26,10,5,'rgba(255,255,255,.25)'); g.restore(); }

  const on=asleep>.5?.25+.2*Math.sin(t*1.3):(Math.sin(t*5.2)>-.2?1:.25);
  g.save(); g.shadowColor='#ff8f4a'; g.shadowBlur=22*on; rr(-8,-244,16,16,8,on>.6?'#ffb27a':'#b8653a'); g.restore();
  g.restore();
}
function gagOn(st,t0){return st.b===1&&st.s>=t0?1:0;}
function gagDrop(st,t0){ if(st.b!==1||st.s<t0-0.35) return null; const dt=st.s-(t0-0.35); return -320*(1-springStep(dt,.42,13)); }

function astroPose(t){
  const base={x:1660,y:850,s:1};
  const k=springStep(t-(T.bring-0.2),.5,9)*(1-springStep(t-T.relax,.5,9));
  const kt=springStep(t-T.title,.5,9);
  return {x:lerp(base.x,1330,k)+kt*-60, y:lerp(base.y,700,k)+kt*-20, s:lerp(1,1.85,k)};
}

/* ==== globe overlays ==== */
function latStreaks(E,R,sp,t,alpha,speed,col,mask){
  if(alpha<=0) return; g.save(); g.lineCap='round'; g.globalCompositeOperation='lighter';
  for(let i=0;i<26;i++){ const r=rng(300+i), lat=(r()*2-1)*1.15, len=.25+r()*.45, ph=r()*6.28, v=speed*(.7+r()*.6);
    const head=((t*v+ph)%(Math.PI*2))-Math.PI;
    g.beginPath(); let started=false; const N=14;
    for(let j=0;j<=N;j++){ const va=head-len+len*j/N; const p=proj(E,R*1.035,lat,anchorLon(va,sp),sp); if(p.z<.08){started=false;continue;} if(!started){g.moveTo(p.x,p.y);started=true;} else g.lineTo(p.x,p.y); }
    const p=proj(E,R,lat,anchorLon(head,sp),sp); const m=mask?mask(p):1; if(m<=0) continue;
    g.strokeStyle=col.replace('A',(alpha*m*(.35+.4*r())).toFixed(3)); g.lineWidth=Math.max(1.5,R*.012*(1+r())); g.stroke(); }
  g.restore();
}
function equatorLine(E,R,sp,t){
  const u=sstep(T.equator,T.equator+.9,t)*(1-sstep(T.earth5+.2,T.earth5+.8,t)); if(u<=0) return;
  g.save(); g.strokeStyle=CY; g.globalAlpha=.9; g.lineWidth=Math.max(2.5,R*.012); g.setLineDash([R*.06,R*.045]); g.lineDashOffset=-t*R*.12; g.lineCap='round';
  g.beginPath(); let on=false; const N=120;
  for(let j=0;j<=N*u;j++){ const va=-Math.PI/2+Math.PI*j/N; const p=proj(E,R*1.005,0,anchorLon(va,sp),sp); if(p.z<0){on=false;continue;} on?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y); on=true; }
  g.stroke(); g.restore();
}
function youSign(t,E,R,sp,lat,lon,t0,t1,playT,label='YOU'){
  if(t<t0-0.01||t>t1+0.4) return null;
  const p=proj(E,R,lat,lon,sp); if(p.z<-.05) return null;
  const drop=-260*(1-springStep(t-t0,.45,14)), sq=.22*springImp(t-t0-.12,.45,14), out=sstep(t1,t1+.35,t);
  const m=playT?springStep(t-playT,.48,13):0;

  g.save(); g.globalAlpha=(1-out)*clamp(p.z*4+.4); g.translate(p.x,p.y);
  g.fillStyle=GOLD; g.beginPath(); g.arc(0,0,8,0,6.2832); g.fill();
  g.fillStyle='rgba(255,217,138,.35)'; g.beginPath(); g.arc(0,0,8+10*(.5+.5*Math.sin(t*5)),0,6.2832); g.fill();
  g.translate(0,-28+drop); g.scale(1+sq*.6,1-sq);
  g.fillStyle='rgba(6,20,40,.82)'; g.beginPath(); g.moveTo(-11,-2); g.lineTo(11,-2); g.lineTo(0,16); g.fill();
  g.beginPath(); g.roundRect(-w/2,-h,w,h,h/2); g.fill();
  if(m<.98){ g.save(); g.globalAlpha*=1-clamp(m*1.6); slideText(t,label,0,-h/2+13,36,GOLD,700,5,t0+.05,null); g.restore(); }
  if(m>.02){ const k=clamp(m); g.fillStyle=GOLD; g.beginPath(); g.moveTo(-9*k+3,-h/2-13*k); g.lineTo(15*k+3,-h/2); g.lineTo(-9*k+3,-h/2+13*k); g.fill(); }
  g.restore(); return {x:p.x,y:p.y-60};
}
function shock(E,R,st){
  const dt=stopDT(st); if(dt<=0||dt>1.2) return;
  g.save(); g.globalCompositeOperation='lighter';
  for(const [d,k] of [[0,1],[.12,.6]]){ const u=clamp((dt-d)/1.0); if(u<=0||u>=1) continue;
    const r=R*(1.05+3.2*easeOutCubic(u)); g.strokeStyle=`rgba(190,240,255,${(1-u)*.75*k})`; g.lineWidth=R*.09*(1-u)+2; g.beginPath(); g.arc(E.x,E.y,r,0,6.2832); g.stroke(); }
  g.restore();
}
const swell=st=>{const dt=stopDT(st); if(dt<=0) return 0; if(dt<.22) return .06*easeOutCubic(dt/.22); if(dt<.55) return .06*(1-easeInCubic((dt-.22)/.33)); return -.02*springImp(dt-.55,.45,14);};

/* ==== main render: pure function of t ==== */
let TEX=null;
function render(t){

  const S=toS(c,SUN.x,SUN.y);

    g.beginPath(); g.arc(S.x,S.y,ORB*c.z,0,6.2832); g.stroke(); g.restore();

  if(st.b===1&&st.s>T.slosh-.2&&st.s<T.poles+1.2){ const u=st.s-(T.slosh-.2); g.save(); g.lineCap='round'; g.globalCompositeOperation='lighter';
    for(let k=0;k<3;k++){ const va=-1.5+(u-k*.35)*1.15; if(va<-1.5||va>1.5) continue; g.beginPath(); let on=false;

      g.strokeStyle=`rgba(210,248,255,${.55*(1-sstep(T.poles+.4,T.poles+1.2,st.s))})`; g.lineWidth=R*.035; g.stroke(); }
    g.restore(); }
  // YOU sign: drops on "you", morphs into a play button on "play"
  const youLon=anchorLon(-.5,spinB(T.you));
  const yP=st.b===1?youSign(t,E,R,sp,.05,youLon,T.you,T.earth5+.15,T.play):null;
  // YOU marker during the orbit time-lapse (day -> night)
  let mk=null;
  if(t>T.six-.4&&t<T.relax+.3){ const p=proj(E,R,.26,anchorLon(-.95,SPIN_STOPPED),sp); const lit=(st.b===1)?clamp((Lv[0]*(p.x-E.x)/R+Lv[1]*(E.y-p.y)/R)*2+.5):1;
    const a=win(t,T.six-.4,T.relax+.3,.3,.3); g.save(); g.globalAlpha=a; g.fillStyle=lit>.5?GOLD:'#ff8f4a';
    g.beginPath(); g.arc(p.x,p.y,5,0,6.2832); g.fill(); g.globalAlpha=a*.4; g.beginPath(); g.arc(p.x,p.y,5+7*(.5+.5*Math.sin(amb*5)),0,6.2832); g.fill(); g.restore();
    g.save(); g.globalAlpha=a; g.fillStyle='rgba(6,20,40,.8)'; const bw=tw('YOU',22,700,4)+30; g.beginPath(); g.roundRect(p.x-bw/2-40,p.y-56,bw,38,19); g.fill(); g.restore();
    g.save(); g.globalAlpha=a; slideText(t,'YOU',p.x-40,p.y-29,22,GOLD,700,4,T.six-.35,null); g.restore(); mk={x:p.x,y:p.y}; }
  // callback sign (reality branch)
  const cbP=st.b===2?youSign(t,E,R,sp,.05,anchorLon(-.95,spinC(T.by)),T.by,T.title-.25,null):null;

  // ---- screen-space graphics ----
  counter(t,T.sixteen,T.stand+.05,1500,190,'EQUATOR SPEED',tt=>fmt(1670*easeOutCubic((tt-T.sixteen)/.7))+' KM/H');
  caption(t,T.wouldnt,R1-.05,[{text:'EVERYTHING ELSE',color:WHITE},{text:'KEEPS GOING',color:CY,t0:T.wouldnt+.12}]);
  caption(t,R1+.02,T.sixteen-.35,[{text:'RIGHT NOW',color:GOLD}]);
  caption(t,T.play,T.earth5-.15,[{text:'YOU PRESSED PLAY',color:WHITE},{text:tt=>(EQ_KMS*tt).toFixed(1)+' KM AGO',color:GOLD,t0:T.play+.15}]);
  caption(t,T.brakes,T.air-.08,[{text:'FULL STOP',color:GOLD}]);
  counter(t,T.air,T.oceans-.25,1500,190,'WIND SPEED',tt=>fmt(1670*easeOutCubic((tt-T.air)/.6))+' KM/H');
  bars(t);
  caption(t,T.tornado+.25,T.oceans-.15,[{text:'OVER 3× THE STRONGEST TORNADO',color:CY,size:40}]);
  caption(t,T.poles,T.oneday-.15,[{text:'OCEANS FLEE TO THE POLES',color:WHITE}]);
  counter(t,T.oneday,T.relax-.05,1500,190,'ONE DAY LASTS',tt=>fmt(24+8742*easeIO((tt-T.oneday-.25)/(T.year10-T.oneday)))+' H',{color:tt=>tt>T.year10+.1?GOLD:WHITE});
  caption(t,T.daylight-.05,T.bring-.2,[{text:'6 MONTHS OF DAY',color:GOLD},{text:'6 MONTHS OF NIGHT',color:CY,t0:T.night}]);

  caption(t,T.by+.15,T.end,[{text:'YOU HAVE MOVED',color:WHITE,size:40},{text:tt=>(EQ_KMS*tt).toFixed(1)+' KM',color:tt=>tt>T.km?GOLD:WHITE,t0:T.by+.3}].map(l=>({...l,color:typeof l.color==='function'?l.color(t):l.color})));

  astronaut(amb,st,look);
  title(t);
  credit(t,.35,T.planet+1.75);
  credit(t,T.title+.9);

}
function bars(t){
  const t0=T.tornado, t1=T.oceans-.15; if(t<t0||t>t1+.4) return;
  const x=110,y=150, full=640, ob=sstep(t1,t1+.35,t);
  g.save(); g.globalAlpha=1-ob;
  g.fillStyle='rgba(6,20,40,.62)'; capsule(g,x-40,y-60,full+300,250,60); g.fill();
  const rows=[['STRONGEST TORNADO',484,'484 KM/H','rgb(143,216,230)'],['STOPPED EARTH WIND',1670,'1,670 KM/H','rgb(255,217,138)']];
  rows.forEach(([lab,v,txt,col],i)=>{ const yy=y+i*100, u=easeOutQuint((t-t0-.15-i*.35)/.9), w=Math.max(30,full*v/1670*u);
    slideText(t,lab,x,yy-8,22,CY,600,5,t0+.05+i*.35,t1,'left');
    g.fillStyle=col; capsule(g,x,yy+6,w,34,17); g.fill();
    g.save(); capsule(g,x,yy+6,w,34,17); g.clip(); const sx=x+((t*260+i*200)%(w+200))-100; const q=g.createLinearGradient(sx-60,0,sx+60,0); q.addColorStop(0,'rgba(255,255,255,0)'); q.addColorStop(.5,'rgba(255,255,255,.45)'); q.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=q; g.fillRect(sx-60,yy,120,50); g.restore();
    slideText(t,txt,x+w+18,yy+33,26,WHITE,700,3,t0+.3+i*.35,t1,'left'); });
  g.restore();
}
function rewindIcon(t){
  for(const r0 of [R1,R2]){ const a=win(t,r0,r0+RW+.15,.1,.2); if(a<=0) continue; const s=1+.25*springImp(t-r0,.45,14);
    g.save(); g.globalAlpha=a; g.translate(140,130); g.scale(s,s); g.fillStyle='rgba(6,20,40,.62)'; g.beginPath(); g.roundRect(-70,-40,140,80,40); g.fill();
    g.fillStyle=GOLD; const o=((t-r0)*60)%8; for(const dx of [-2,-30]){ g.beginPath(); g.moveTo(dx+28-o,-20); g.lineTo(dx-2-o,0); g.lineTo(dx+28-o,20); g.fill(); } g.restore(); }
}
function lookTarget(t,E,R,yP,mk,cbP,S){
  const segs=[[0,E],[T.sixteen,{x:1500,y:190}],[T.you,yP||E],[T.nothing,null],[T.earth5+.8,S],[T.now,E],[T.air,{x:1500,y:190}],[T.tornado,{x:400,y:220}],[T.oceans,E],[T.oneday+.2,{x:1500,y:190}],[T.six,mk||E],[T.sunglasses,null],[T.relax,E],[T.slowing,{x:1500,y:190}],[T.by,cbP||E],[T.title,{x:960,y:330}]];
  let i=0; while(i+1<segs.length&&t>=segs[i+1][0]) i++;

}
function title(t){
  if(t<T.title) return;
  const u=springStep(t-T.title,.5,12); const y=300;
  const w1=tw('WHAT IF EARTH',92,700,6), w2=tw('STOPPED SPINNING',92,700,6), bw=Math.max(w1,w2)+130, bh=250;
  g.save(); g.globalAlpha=clamp((t-T.title)/.12); g.fillStyle='rgba(6,20,40,.62)'; g.translate(960,y); g.scale(.7+.3*u,.7+.3*u); capsule(g,-bw/2,-bh/2,bw,bh,bh/2); g.fill(); g.restore();

function credit(t,t0,t1=null){

  g.save(); g.globalAlpha=clamp((t-t0)/.15)*(t1==null?1:1-sstep(t1+.05,t1+.4,t)); g.fillStyle='rgba(6,20,40,.62)'; capsule(g,x,y-30,w*(.7+.3*springStep(t-t0,.5,15)),56,28); g.fill(); g.restore();

}
/* ==== finishing: vignette + 6% film grain re-randomised 24x/s ==== */
let vig=null; const grain=document.createElement('canvas'); grain.width=960; grain.height=540; const gg=grain.getContext('2d'); let grainIdx=-1; const gid=gg.createImageData(960,540);
function post(t){
  if(!vig){vig=g.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,W*.62);vig.addColorStop(0,'rgba(4,4,20,0)');vig.addColorStop(1,'rgba(4,4,20,.45)');}

  const idx=Math.floor(t*24); if(idx!==grainIdx){ grainIdx=idx; const r=rng(idx*7919+13), d=gid.data; for(let i=0;i<d.length;i+=4){const v=r()*255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;} gg.putImageData(gid,0,0); }

}
/* ==== motion blur: 2 sub-frames, shutter 0.6 at 60 fps ==== */
function renderFrame(t){ const d=0.15/60; render(t-d); ga.drawImage(cv,0,0); render(t+d); g.save(); g.setTransform(1,0,0,1,0,0); g.globalAlpha=.5; g.globalCompositeOperation='source-over'; g.drawImage(acc,0,0); g.restore(); }
window.render=render; window.renderFrame=renderFrame; window.T=T;
(async()=>{
  const ff=new FontFace('Fredoka',`url(data:font/woff2;base64,${FONT_B64})`,{weight:'300 700'}); await ff.load(); document.fonts.add(ff);

})();
