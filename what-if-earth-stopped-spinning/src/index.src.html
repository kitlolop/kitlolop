<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ถ้าโลกหยุดหมุน</title>
<style>
html,body{margin:0;background:#050b16;color:#8fd8e6;font-family:sans-serif}
#c{display:block;width:100%;max-width:1920px;height:auto;margin:0 auto}
#ui{max-width:1920px;margin:8px auto;padding:0 16px;box-sizing:border-box;display:flex;gap:12px;align-items:center}
#ui input{flex:1}
body.render #ui{display:none}
</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="ui"><input id="scrub" type="range" min="0" max="60" step="0.01" value="0"><span id="tt">0.00</span></div>
<script>
'use strict';
/* ==== data (inlined at build) ==== */
const WORDS=/*@WORDS@*/null;
const GEO=/*@GEO@*/null;
const FONT_B64='/*@FONT@*/', FONT_TH5='/*@FONT_TH5@*/', FONT_TH6='/*@FONT_TH6@*/';

/* ==== constants ==== */
const W=1920,H=1080, CY='#8fd8e6', GOLD='#ffd98a', WHITE='#ffffff';
const SUN={x:0,y:540}, RS=300, RE=175, ORB=1180;
const cv=document.getElementById('c'), g=cv.getContext('2d');
const acc=document.createElement('canvas'); acc.width=W; acc.height=H; const ga=acc.getContext('2d');

/* ==== math ==== */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const easeIO=u=>{u=clamp(u);return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2};
const easeOutQuint=u=>1-Math.pow(1-clamp(u),5);
const easeInCubic=u=>{u=clamp(u);return u*u*u};
const easeOutCubic=u=>1-Math.pow(1-clamp(u),3);
const sstep=(a,b,x)=>{const u=clamp((x-a)/(b-a));return u*u*(3-2*u)};
const win=(t,a,b,fi=.25,fo=.25)=>sstep(a,a+fi,t)*(1-sstep(b-fo,b,t));
// damped spring (damping .42-.5, freq 12-16 rad/s)
function springStep(dt,z=.45,w=14){if(dt<=0)return 0;const k=Math.sqrt(1-z*z),wd=w*k;return 1-Math.exp(-z*w*dt)*(Math.cos(wd*dt)+z/k*Math.sin(wd*dt));}
function springImp(dt,z=.45,w=14){if(dt<=0)return 0;const wd=w*Math.sqrt(1-z*z);return Math.exp(-z*w*dt)*Math.sin(wd*dt);}
function rng(seed){let s=(seed>>>0)||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
const fmt=n=>Math.round(n).toLocaleString('en-US');

/* ==== word-locked timeline ==== */
function at(line,word,n=0){const ws=WORDS.words.filter(w=>w.line===line&&w.w.toLowerCase()===word.toLowerCase());if(!ws[n])throw new Error('missing word '+line+':'+word);return ws[n].s;}
const T={
 stopped:at(0,'stopped'), planet:at(1,'The'), wouldnt:at(1,"wouldn't"),
 right:at(2,'Right'), equator:at(2,'equator'), sixteen:at(2,'sixteen'),
 stand:at(3,'Stand'), you:at(3,'you'), play:at(4,'play'), nothing:at(4,'nothing'),
 earth5:at(5,'Earth'), day5:at(5,'day'), year5:at(5,'year'),
 now:at(6,'Now'), brakes:at(6,'brakes'), air:at(7,'air'),
 winds:at(8,'Winds'), tornado:at(8,'tornado'),
 oceans:at(9,'oceans'), slosh:at(9,'slosh'), waves:at(9,'waves'), poles:at(9,'poles'),
 oneday:at(10,'day'), year10:at(10,'year'),
 six:at(11,'Six'), daylight:at(11,'daylight'), night:at(11,'night'),
 bring:at(12,'Bring'), sunglasses:at(12,'sunglasses'), mask:at(12,'mask'),
 relax:at(13,'Relax'), slowing:at(13,'slowing'), ms:at(13,'milliseconds'),
 by:at(14,'By'), km:at(14,'kilometers'), moving:at(14,'moving'),
};
T.vo=WORDS.duration; T.title=T.vo+0.36; T.end=60;
const EQ_KMS=0.4651; // equatorial surface speed, km per second

/* ==== story clock (separate from ambient clock; rewinds are coherent) ====
   branch 0: opening "what if" stop  -> rewind 1 ("Right now") ->
   branch 1: explanation + hypothetical braking -> rewind 2 ("Relax") ->
   branch 2: reality */
const RW=0.8, R1=T.right, R2=T.relax, A_BACK=T.stopped-0.55, B_BACK=T.brakes-0.45;
function story(t){
  if(t<R1) return {b:0,s:t,rw:0};
  if(t<R1+RW) return {b:0,s:lerp(R1,A_BACK,easeIO((t-R1)/RW)),rw:1};
  if(t<R2) return {b:1,s:t,rw:0};
  if(t<R2+RW) return {b:1,s:lerp(R2,B_BACK,easeIO((t-R2)/RW)),rw:2};
  return {b:2,s:t,rw:0};
}
const W0=0.22, TAU=0.14, B1=R1+RW, B2=R2+RW;
const decel=x=>x<=0?0:W0*TAU*(1-Math.exp(-x/TAU));
const spinA=s=>s<T.stopped?W0*s:W0*T.stopped+decel(s-T.stopped);
const spinB=s=>{const a=spinA(A_BACK);return s<T.brakes?a+W0*(s-B1):a+W0*(T.brakes-B1)+decel(s-T.brakes);};
const spinC=s=>spinB(B_BACK)+W0*(s-B2);
const spin=st=>st.b===0?spinA(st.s):st.b===1?spinB(st.s):spinC(st.s);
const inertial=st=>st.b===0?W0*st.s:st.b===1?W0*A_BACK+W0*(st.s-B1):W0*A_BACK+W0*(B_BACK-B1)+W0*(st.s-B2);
const stopDT=st=>st.b===0?st.s-T.stopped:st.b===1?st.s-T.brakes:-1;
const orbitA=st=>st.b===1?Math.PI*easeIO((st.s-T.six)/(T.night+0.45-T.six)):0;
const drainU=st=>st.b===1?easeIO((st.s-T.poles)/1.8):0;
const SPIN_STOPPED=spinB(T.brakes+10);

/* ==== camera: easeInOutCubic moves, zoom interpolated in log space ==== */
const CAM=[ // [start, duration, x, y, zoom]
 [0,0,1180,540,2.25],
 [0,T.planet,1180,540,2.38],
 [T.planet,1.55,960,540,1.0],
 [T.planet+1.55,T.right-T.planet-1.55,1000,540,1.06],
 [T.right,RW,1080,540,1.22],
 [T.right+RW,T.stand-T.right-RW,1140,540,1.42],
 [T.stand,1.3,1195,515,2.3],
 [T.stand+1.3,T.earth5-T.stand-1.3,1195,520,2.4],
 [T.earth5,2.9,0,540,0.3],
 [T.earth5+2.9,T.now-T.earth5-2.9,0,540,0.32],
 [T.now,1.5,1130,540,1.15],
 [T.now+1.5,T.oceans-T.now-1.5,1100,545,1.3],
 [T.oceans,2.2,1180,520,1.75],
 [T.oceans+2.2,T.oneday-0.2-T.oceans-2.2,1180,500,1.86],
 [T.oneday-0.2,2.6,0,560,0.355],
 [T.oneday+2.4,T.relax-T.oneday-2.4,0,560,0.375],
 [T.relax,RW,1150,540,1.2],
 [T.relax+RW,T.by-T.relax-RW,1160,540,1.45],
 [T.by,1.0,1185,525,1.95],
 [T.by+1.0,T.title-T.by-1.0,1185,525,2.05],
 [T.title,3.6,1080,600,0.95],
];
function camera(t){
  let c={x:CAM[0][2],y:CAM[0][3],z:CAM[0][4]};
  for(const [s,d,x,y,z] of CAM){ if(t<s) break; const u=d<=0?1:easeIO((t-s)/d);
    c={x:lerp(c.x,x,u),y:lerp(c.y,y,u),z:Math.exp(lerp(Math.log(c.z),Math.log(z),u))}; }
  // ambient drift (never static) + impact shake
  c.x+=Math.sin(t*.37)*5/c.z; c.y+=Math.cos(t*.29)*4/c.z;
  const sh=springImp(t-T.stopped,.42,16)*9+springImp(t-T.brakes,.42,16)*9;
  c.sx=sh; return c;
}
const toS=(c,x,y)=>({x:(x-c.x)*c.z+W/2+c.sx, y:(y-c.y)*c.z+H/2});

/* ==== fonts / text ==== */
function font(size,weight=700,spacing=4){g.font=`${weight} ${size}px Fredoka, Mitr`; g.letterSpacing=spacing+'px';}
const TH=/[\u0E00-\u0E7F]/, lsp=(text,sp)=>TH.test(text)?Math.min(sp,1):sp;
function tw(text,size,weight=700,spacing=4){spacing=lsp(text,spacing);font(size,weight,spacing);return g.measureText(text).width-spacing;}
const GRAPH=new Intl.Segmenter('th',{granularity:'grapheme'}), graphemes=s=>[...GRAPH.segment(s)].map(x=>x.segment);
function capsule(ctx,x,y,w,h,r){r=Math.min(r,h/2,w/2);ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
// text line that slides up 1.3x its height through a clip (ease-out-quint); exits upward
function slideText(t,text,cx,base,size,color,weight,spacing,tIn,tOut,align='center'){
  const h=size*1.12, ui=easeOutQuint((t-tIn)/.55), uo=tOut==null?0:easeInCubic((t-tOut)/.32);
  if(ui<=0||uo>=1) return 0;
  const w=tw(text,size,weight,spacing);
  const x=align==='center'?cx-w/2:cx;
  g.save(); g.beginPath(); g.rect(x-size,base-size*1.12,w+2*size,h+size*0.48); g.clip();
  g.fillStyle=color; g.textAlign='left'; g.textBaseline='alphabetic'; font(size,weight,lsp(text,spacing));
  g.fillText(text,x,base+(1-ui)*1.3*h-uo*1.3*h);
  g.restore(); return w;
}
// caption: capsule box rgb(6,20,40) @62% with stacked lines (each line {text|fn,color,size,t0})
function caption(t,t0,t1,lines,cx=960,cy=950){
  if(t<t0-0.05||t>t1+0.4) return;
  const pad=30, gap=12;
  const L=lines.map(l=>{const text=typeof l.text==='function'?l.text(t):l.text;const size=l.size||44;return {...l,text,size,w:tw(text,size,l.weight||700,l.sp||4)};});
  const hTot=L.reduce((a,l)=>a+l.size*1.12,0)+gap*(L.length-1)+pad*1.1;
  const wMax=Math.max(...L.map(l=>l.w))+pad*2.4;
  const ib=springStep(t-t0,.5,15), ob=sstep(t1+.05,t1+.38,t);
  const a=clamp((t-t0)/.12)*(1-ob); if(a<=0) return;
  const bw=wMax*(0.55+0.45*ib), bh=hTot*(0.7+0.3*ib);
  g.save(); g.globalAlpha=a; g.fillStyle='rgba(6,20,40,.62)'; capsule(g,cx-bw/2,cy-bh/2,bw,bh,bh/2); g.fill(); g.restore();
  let y=cy-hTot/2+pad*0.55;
  for(const l of L){ y+=l.size*0.92; slideText(t,l.text,cx,y,l.size,l.color||WHITE,l.weight||700,l.sp||4,(l.t0??t0)+0.04,t1); y+=l.size*0.2+gap; }
}
// counter card that slams in from 1.7x to 1x on a damped spring
function counter(t,t0,t1,x,y,label,valueFn,opts={}){
  if(t<t0||t>t1+0.4) return;
  const sc=1+0.7*(1-springStep(t-t0,.45,14)), ob=sstep(t1,t1+.35,t);
  const lab=label, val=valueFn(t), col=opts.color?opts.color(t):WHITE;
  const lw=tw(lab,24,600,5), vw=tw(val,78,700,3), bw=Math.max(lw,vw)+80, bh=150;
  g.save(); g.translate(x,y); g.scale(sc*(1-ob*.3),sc*(1-ob*.3)); g.translate(-x,-y);
  g.globalAlpha=clamp((t-t0)/.08)*(1-ob);
  g.fillStyle='rgba(6,20,40,.62)'; capsule(g,x-bw/2,y-bh/2,bw,bh,bh/2); g.fill();
  g.globalAlpha=1-ob;
  slideText(t,lab,x,y-26,24,CY,600,5,t0+.03,t1);
  slideText(t,val,x,y+50,78,col,700,3,t0+.07,t1);
  g.restore();
}
function arcText(t,text,cx,cy,r,a0,size,color,tIn,alpha=1){
  font(size,700,0); g.save(); g.globalAlpha=alpha; g.fillStyle=color; g.textAlign='center'; g.textBaseline='alphabetic';
  g.beginPath(); g.arc(cx,cy,r+size*1.5,0,Math.PI*2); g.arc(cx,cy,r+2,0,Math.PI*2,true); g.clip();
  let a=a0; const sp=5;
  graphemes(text).forEach((ch,i)=>{const w=g.measureText(ch).width+sp, da=w/r, u=easeOutQuint((t-tIn-i*.03)/.55);
    const rr=r+6-(1-u)*1.3*size; const m=a+da/2;
    g.save(); g.translate(cx+Math.cos(m)*rr,cy+Math.sin(m)*rr); g.rotate(m+Math.PI/2); g.fillText(ch,0,0); g.restore(); a+=da;});
  g.restore();
}

/* ==== background: gradient, nebulae, parallax stars ==== */
const R0=rng(7);
const NEB=[[-700,-250,1050,'24,150,160',.20],[900,420,900,'40,95,195',.16],[300,-600,800,'220,95,110',.10],[-1500,500,950,'60,70,175',.15],[1700,-500,850,'24,150,160',.20]];
const TW_=4000,TH_=2400;
const STARS=[[.12,620],[.35,300],[.6,150]].map(([d,n])=>Array.from({length:n},()=>({x:R0()*TW_,y:R0()*TH_,r:(.6+R0()*1.1)*(d>.5?1.5:d>.3?1.1:.8),p:R0()*6.28,f:.6+R0()*2.2,a:.35+R0()*.6,sp:d>.5&&R0()<.4,d})));
let bgGrad=null;
function background(c,t){
  if(!bgGrad){bgGrad=g.createLinearGradient(0,0,0,H);bgGrad.addColorStop(0,'#081d2c');bgGrad.addColorStop(1,'#102348');}
  g.fillStyle=bgGrad; g.fillRect(0,0,W,H);
  const zf=Math.pow(c.z,.08);
  for(const [x,y,r,col,a] of NEB){ const sx=W/2+(x-(c.x-960)*.08)*zf, sy=H/2+(y-(c.y-540)*.08)*zf, rr=r*zf;
    const gr=g.createRadialGradient(sx,sy,0,sx,sy,rr); gr.addColorStop(0,`rgba(${col},${a})`); gr.addColorStop(.55,`rgba(${col},${a*.45})`); gr.addColorStop(1,`rgba(${col},0)`);
    g.fillStyle=gr; g.fillRect(sx-rr,sy-rr,rr*2,rr*2); }
  for(const layer of STARS){ const d=layer[0].d, z=Math.pow(c.z,d);
    for(const s of layer){ let lx=((s.x-(c.x-960)*d)%TW_+TW_)%TW_-TW_/2, ly=((s.y-(c.y-540)*d)%TH_+TH_)%TH_-TH_/2;
      const x=W/2+lx*z, y=H/2+ly*z; if(x<-20||x>W+20||y<-20||y>H+20) continue;
      const tw_=s.a*(.55+.45*Math.sin(t*s.f+s.p)), r=s.r*Math.max(.6,Math.sqrt(z));
      if(s.sp){ const L=r*5*(.8+.2*Math.sin(t*s.f*1.3+s.p));
        g.fillStyle=`rgba(230,245,255,${tw_})`; g.beginPath();
        g.moveTo(x,y-L);g.quadraticCurveTo(x,y,x+L,y);g.quadraticCurveTo(x,y,x,y+L);g.quadraticCurveTo(x,y,x-L,y);g.quadraticCurveTo(x,y,x,y-L);g.fill();
      } else { g.fillStyle=`rgba(220,238,255,${tw_})`; g.beginPath(); g.arc(x,y,r,0,6.2832); g.fill(); } } }
}

/* ==== sun ==== */
const GRAN=Array.from({length:28},(_,i)=>{const r=rng(100+i);return {rr:.12+r()*.78,a:r()*6.28,w:(r()<.5?-1:1)*(.03+r()*.05),s:.05+r()*.07,p:r()*6.28};});
function sun(c,t){
  const p=toS(c,SUN.x,SUN.y), r=RS*c.z; if(p.x+r*2.3<0) return p;
  g.save(); g.globalCompositeOperation='lighter';
  let gr=g.createRadialGradient(p.x,p.y,r*.9,p.x,p.y,r*2.5); gr.addColorStop(0,'rgba(255,190,110,.30)'); gr.addColorStop(1,'rgba(255,160,90,0)');
  g.fillStyle=gr; g.beginPath(); g.arc(p.x,p.y,r*2.5,0,6.2832); g.fill();
  [[1.23,.20],[1.48,.13],[1.76,.085],[2.1,.06]].forEach(([k,a],i)=>{const w=.1+.02*i, pulse=1+.08*Math.sin(t*.8+i);
    const q=g.createRadialGradient(p.x,p.y,r*(k-w),p.x,p.y,r*(k+w));
    q.addColorStop(0,'rgba(255,205,130,0)');q.addColorStop(.5,`rgba(255,205,130,${a*pulse})`);q.addColorStop(1,'rgba(255,205,130,0)');
    g.fillStyle=q; g.beginPath(); g.arc(p.x,p.y,r*(k+w),0,6.2832); g.fill();});
  for(let i=0;i<18;i++){ const a=i*Math.PI*2/18+t*.045, hw=.03+.012*Math.sin(i*1.7), L=r*(2.4+.4*Math.sin(i*2.3+t*.4));
    const q=g.createRadialGradient(p.x,p.y,r*.95,p.x,p.y,L); q.addColorStop(0,'rgba(255,215,150,.07)'); q.addColorStop(1,'rgba(255,215,150,0)');
    g.fillStyle=q; g.beginPath(); g.moveTo(p.x+Math.cos(a-hw)*r*.95,p.y+Math.sin(a-hw)*r*.95); g.lineTo(p.x+Math.cos(a)*L,p.y+Math.sin(a)*L); g.lineTo(p.x+Math.cos(a+hw)*r*.95,p.y+Math.sin(a+hw)*r*.95); g.fill(); }
  g.restore();
  gr=g.createRadialGradient(p.x+r*.15,p.y-r*.15,0,p.x,p.y,r); gr.addColorStop(0,'#fff7dc'); gr.addColorStop(.55,'#ffc857'); gr.addColorStop(1,'#ff8f4a');
  g.fillStyle=gr; g.beginPath(); g.arc(p.x,p.y,r,0,6.2832); g.fill();
  g.save(); g.beginPath(); g.arc(p.x,p.y,r,0,6.2832); g.clip(); g.globalCompositeOperation='lighter';
  for(const s of GRAN){ const a=s.a+t*s.w, rr=r*(s.rr+.04*Math.sin(t*.7+s.p)), x=p.x+Math.cos(a)*rr, y=p.y+Math.sin(a)*rr, R=r*s.s*(1+.25*Math.sin(t*1.3+s.p));
    const q=g.createRadialGradient(x,y,0,x,y,R); q.addColorStop(0,'rgba(255,250,215,.28)'); q.addColorStop(1,'rgba(255,250,215,0)'); g.fillStyle=q; g.fillRect(x-R,y-R,2*R,2*R); }
  const hx=p.x+r*.28, hy=p.y-r*.32, q=g.createRadialGradient(hx,hy,0,hx,hy,r*.75); q.addColorStop(0,'rgba(255,255,240,.32)'); q.addColorStop(1,'rgba(255,255,240,0)');
  g.fillStyle=q; g.fillRect(p.x-r,p.y-r,2*r,2*r); g.restore();
  return p;
}

/* ==== Earth textures (2048x1024 equirectangular, drawn from lon/lat polygons) ==== */
const TXW=2048, TXH=1024;
const ll=(lon,lat)=>[(lon+180)/360*TXW,(90-lat)/180*TXH];
function landPath(){const p=new Path2D();for(const poly of GEO.land){poly.forEach(([lo,la],i)=>{const [x,y]=ll(lo,la);i?p.lineTo(x,y):p.moveTo(x,y);});p.closePath();}return p;}
function makeTextures(){
  const LP=landPath();
  const col=document.createElement('canvas'); col.width=TXW; col.height=TXH; const c=col.getContext('2d');
  const og=c.createLinearGradient(0,0,0,TXH); og.addColorStop(0,'#1a66b8'); og.addColorStop(.5,'#2a86cc'); og.addColorStop(1,'#1a66b8');
  c.fillStyle=og; c.fillRect(0,0,TXW,TXH);
  c.save(); c.shadowColor='#4dc7eb'; c.shadowBlur=34; c.fillStyle='#4dc7eb'; c.fill(LP); c.fill(LP); c.restore();
  c.fillStyle='#5fc47a'; c.fill(LP);
  c.save(); c.clip(LP);
  const blob=(lon,lat,rx,ry,rot,color)=>{const [x,y]=ll(lon,lat);c.fillStyle=color;c.beginPath();c.ellipse(x,y,rx/360*TXW,ry/180*TXH,rot,0,6.2832);c.fill();};
  [[-100,57,32,7,0],[90,61,62,8,0],[15,50,15,6,.1],[-82,38,10,7,.2],[113,30,9,7,0],[-48,-20,8,6,.3],[25,-12,10,4,0],[145,-32,5,4,.4]].forEach(b=>blob(...b,'#48ad6b'));
  [[-62,-4,15,9,0],[22,0,10,5,0],[102,12,7,8,0],[115,-1,15,4,0],[-86,12,6,4,.5],[-4,7,9,2.6,0]].forEach(b=>blob(...b,'#3a9d62'));
  [[10,23,29,8,0],[47,22,11,7,.3],[132,-25,15,7,0],[104,43,15,4,0],[83,39,8,3,0],[21,-23,6,5,0],[-111,31,6,4,.5],[-70,-23,2.2,7,0],[60,30,10,4,.2]].forEach(b=>blob(...b,'#f5c75f'));
  c.fillStyle='#f1f8ff'; { const [,y]=ll(0,-62); c.fillRect(0,y,TXW,TXH-y); const [,y2]=ll(0,76); c.fillRect(0,0,TXW,y2); }
  blob(-41,73,13,10,0,'#f1f8ff'); blob(-40,66,6,4,0,'#f1f8ff');
  c.restore();
  const dat=document.createElement('canvas'); dat.width=TXW; dat.height=TXH; const d=dat.getContext('2d');
  d.fillStyle='#000'; d.fillRect(0,0,TXW,TXH); d.fillStyle='#f00'; d.fill(LP);

function bars(t){

    slideText(t,txt,x+w+18,yy+33,26,WHITE,700,3,t0+.3+i*.35,t1,'left'); });

function rewindIcon(t){

    g.fillStyle=GOLD; const o=((t-r0)*60)%8; for(const dx of [-2,-30]){ g.beginPath(); g.moveTo(dx+28-o,-20); g.lineTo(dx-2-o,0); g.lineTo(dx+28-o,20); g.fill(); } g.restore(); }
}
function lookTarget(t,E,R,yP,mk,cbP,S){

  let i=0; while(i+1<segs.length&&t>=segs[i+1][0]) i++;
  const P=astroPose(t), front={x:P.x-10,y:P.y-125*P.s};

/* ==== finishing: vignette + 6% film grain re-randomised 24x/s ==== */
